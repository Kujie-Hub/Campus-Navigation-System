            const modal = document.getElementById('floor-plan-modal');
            const floorImage = document.getElementById('floor-image');
            const classroomMarker = document.getElementById('classroom-marker');
            
            // 重置全屏状态
            isFullscreen = false;
            modal.classList.remove('fullscreen');
            
            // 隐藏标记，直到图片加载完成
            classroomMarker.style.display = 'none';
            
            // 设置楼层标题
            document.getElementById('modal-floor').textContent = floor;
            
            // 设置教室信息
            const classroomCode = `C5-${floor}${String(roomNumber).padStart(2, '0')}`;
            document.getElementById('info-classroom').textContent = classroomCode;
            document.getElementById('info-floor').textContent = `${floor}楼`;
            document.getElementById('info-room').textContent = roomNumber;
            
            // 重置缩放
            floorPlanZoom = 1;
            updateFloorPlanZoom();
            
            // 清除旧的onload回调
            floorImage.onload = null;
            
            // 设置新的图片源
            const imagePath = `data/C-5-${floor}floor.png`;
            floorImage.src = imagePath;
            
            // 显示弹窗
            modal.classList.add('active');
            
            // 等待图片加载后设置标记位置
            if (floorImage.complete && floorImage.naturalWidth > 0) {
                // 图片已在缓存中，直接设置标记
                updateClassroomMarker(floor, roomNumber);
            } else {
                // 图片需要加载
                floorImage.onload = function() {
                    console.log(`[教室导航] 图片加载完成: ${imagePath}`);
                    updateClassroomMarker(floor, roomNumber);
                };
            }
            
            // 处理图片加载错误
            floorImage.onerror = function() {
                console.error(`[教室导航] 图片加载失败: ${imagePath}`);
                classroomMarker.style.display = 'none';
            };
            
            console.log(`[教室导航] 打开楼层平面图: ${classroomCode}, 楼层: ${floor}, 图片路径: ${imagePath}`);
        }

         * @param {number} floor - 楼层号 (1-5)
         * @param {number} roomNumber - 房间号
         */
        function updateClassroomMarker(floor, roomNumber) {
            const marker = document.getElementById('classroom-marker');
            const container = document.getElementById('floor-image-container');
            const floorImage = document.getElementById('floor-image');
            
            // 获取该楼层的位置数据
            const positions = CLASSROOM_POSITIONS[floor];
            if (!positions) {
                console.warn(`[教室导航] 未找到楼层 ${floor} 的位置数据`);
                marker.style.display = 'none';
                return;
            }
            
            // 获取房间号对应的位置
            const pos = positions[roomNumber.toString()];
            if (!pos) {
                console.warn(`[教室导航] 未找到房间号 ${roomNumber} 在楼层 ${floor} 的位置`);
                marker.style.display = 'none';
                return;
            }
            
            // 检查图片是否已加载
            if (!floorImage.naturalWidth || !floorImage.naturalHeight) {
                console.warn('[教室导航] 图片未加载完成，无法计算标记位置');
                marker.style.display = 'none';
                return;
            }
            
            // 根据百分比位置计算实际像素位置
            const x = (pos.x / 100) * floorImage.naturalWidth;
            const y = (pos.y / 100) * floorImage.naturalHeight;
            
            // 设置标记位置
            marker.style.left = x + 'px';
            marker.style.top = y + 'px';
            marker.style.display = 'block';
            
            console.log(`[教室导航] 教室标记位置已更新: ${floor}楼-${roomNumber}, 位置: (${x.toFixed(0)}, ${y.toFixed(0)})`);
        }

        /**
         * 设置楼层平面图缩放级别
         * @param {number} zoomLevel - 缩放级别 (0.25, 0.5, 1, 2)
         */
        function setZoom(zoomLevel) {
            // 限制缩放范围
            const minZoom = 0.25;
            const maxZoom = 2;
            floorPlanZoom = Math.max(minZoom, Math.min(maxZoom, zoomLevel));
            
            updateFloorPlanZoom();
            
            // 更新缩放按钮状态
            document.querySelectorAll('.zoom-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.remove('disabled');
                const btnZoom = parseFloat(btn.textContent) / 100;
                if (btnZoom === floorPlanZoom) {
                    btn.classList.add('active');
                }
                // 禁用超出范围的按钮
                if (btnZoom < minZoom || btnZoom > maxZoom) {
                    btn.classList.add('disabled');
                }
            });
            
            console.log(`[教室导航] 缩放级别: ${floorPlanZoom * 100}%`);
        }

        /**
         * 更新楼层平面图缩放显示
         */
        function updateFloorPlanZoom() {
            const floorImage = document.getElementById('floor-image');
            const container = document.getElementById('floor-image-container');
            
            // 应用缩放变换
            floorImage.style.transform = `translate(-50%, -50%) scale(${floorPlanZoom})`;
            
            // 如果缩放后超出容器，添加滚动
            if (floorImage.naturalWidth > 0 && floorImage.naturalHeight > 0) {
                const containerRect = container.getBoundingClientRect();
                const scaledWidth = floorImage.naturalWidth * floorPlanZoom;
                const scaledHeight = floorImage.naturalHeight * floorPlanZoom;
                
                container.style.overflow = (scaledWidth > containerRect.width || scaledHeight > containerRect.height) ? 'scroll' : 'hidden';
            }
        }

        // 更新楼梯信息显示
        function updateStairInfo(stairs) {
            const content = document.getElementById('stair-content');
            
            if (stairs && stairs.length > 0) {
                const stairNames = stairs.map(s => STAIR_NAMES[s] || s).join('、');
                content.innerHTML = `建议从 <strong>${stairNames}</strong> 上楼，到达${stairs.length > 1 ? '最近的' : ''}楼梯口后，按楼层平面图指引前往教室。`;
            } else {
                content.textContent = '请选择教室查看推荐路线';
            }
        }

        /**
         * 教室导航主函数
         * 整合教室导航与校园导航系统，实现从用户位置到目标教室的完整导航流程
         * 功能：
         * 1. 用户输入起点位置
         * 2. 用户输入教室编号作为终点
         * 3. 自动计算到教室绑定的两个楼梯口中最近的一个
         * 4. 一键生成完整的校园导航路径
         */
        async function navigateToClassroom() {
            const classroomInput = document.getElementById('classroom-input');
            const classroom = classroomInput.value.trim();
            
            const startInput = document.getElementById('classroom-start-input');
            const startValue = startInput.value.trim();
            
            // 清除之前的错误提示
            hideErrorMessage();
            
            // 验证教室输入
            const validation = validateClassroomInput(classroom);
            if (!validation.valid) {
                showErrorMessage(validation.error);
                closeFloorPlanModal();
                return;
            }
            
            // 验证起点输入
            if (!startValue) {
                showErrorMessage('请先输入起点位置！');
                return;
            }
            
            // 设置起点（优先使用教室导航模块的起点输入）
            if (!await setClassroomNavigationStart(startValue)) {
                showErrorMessage('未找到起点位置，请检查输入！');
                return;
            }
            
            // 调用后端API获取导航信息
            const apiResult = await callClassroomAPI(classroom);
            
            let result;
            if (apiResult && apiResult.valid) {
                // 使用后端API结果
                result = apiResult;
            } else {
                // 使用前端验证结果（降级方案）
                result = {
                    valid: true,
                    classroom: validation.classroom,
                    floor: validation.floor,
                    room_number: validation.roomNumber,
                    recommended_stairs: getRecommendedStairs(validation.floor, validation.roomNumber)
                };
            }
            
            if (!result.valid) {
                showErrorMessage(result.error || '验证失败');
                closeFloorPlanModal();
                return;
            }
            
            // 显示成功提示
            showErrorMessage('教室导航成功！', true);
            
            // 打开楼层平面图弹窗
            openFloorPlanModal(result.floor, result.room_number);
            
            // 更新楼梯信息
            updateStairInfo(result.recommended_stairs);
            
            // 将教室信息同步到终点输入框（建立位置关联）
            syncClassroomToDestination(result);
            
            // 如果用户已选择起点，自动规划到推荐楼梯口的路径
            if (currentStartId && result.recommended_stairs && result.recommended_stairs.length > 0) {
                await planRouteToStair(result.recommended_stairs);
            }
            
            console.log(`[教室导航] 导航完成: ${result.classroom}, 起点: ${currentStartId}, 目标楼梯: ${result.recommended_stairs.join(', ')}`);
        }
        
        /**
         * 设置教室导航的起点位置
         * 将教室导航模块的起点输入与校园导航系统的起点进行绑定
         * @param {string} startValue - 起点名称
         * @returns {boolean} 是否设置成功
         */
        async function setClassroomNavigationStart(startValue) {
            const allPoints = getAllPoints();
            
            // 查找匹配的节点
            const matchedPoint = allPoints.find(p => 
                p.name.toLowerCase() === startValue.toLowerCase() || 
                p.id.toLowerCase() === startValue.toLowerCase() ||
                p.name.toLowerCase().includes(startValue.toLowerCase()) ||
                p.id.toLowerCase().includes(startValue.toLowerCase())
            );
            
            if (matchedPoint) {
                // 设置全局起点变量
                currentStartId = matchedPoint.id;
                currentStartFloor = matchedPoint.floor;
                
                // 同步到主导航模块的起点输入框
                const mainStartInput = document.getElementById('start-input');
                mainStartInput.value = matchedPoint.name;
                
                // 高亮显示起点标记
                const markers = document.querySelectorAll('.point-marker');
                markers.forEach(marker => {
                    if (marker.dataset.id === matchedPoint.id) {
                        marker.classList.remove('normal', 'floor-1', 'floor-2', 'end');
                        marker.classList.add('start');
                    }
                });
                
                console.log(`[教室导航] 起点已设置: ${matchedPoint.name}, ID: ${matchedPoint.id}, 楼层: ${matchedPoint.floor}`);
                return true;
            } else {
                console.warn(`[教室导航] 未找到起点节点: ${startValue}`);
                return false;
            }
        }
        
        /**
         * 确保起点已正确设置（备用函数）
         * 检查起点输入框，如果用户输入了起点名称，则查找对应的节点
         */
        function ensureStartPointSelected() {
            const startInput = document.getElementById('start-input');
            const startValue = startInput.value.trim();
            
            if (!startValue) {
                console.log('[教室导航] 起点未设置，请先选择起点位置');
                return;
            }
            
            // 如果起点ID为空或与输入不匹配，尝试查找
            if (!currentStartId || currentStartId !== startValue) {
                const allPoints = getAllPoints();
                const matchedPoint = allPoints.find(p => 
                    p.name === startValue || 
                    p.id === startValue
                );
                
                if (matchedPoint) {
                    currentStartId = matchedPoint.id;
                    currentStartFloor = matchedPoint.floor;
                    console.log(`[教室导航] 起点已设置: ${matchedPoint.name}, 楼层: ${matchedPoint.floor}`);
                } else {
                    console.warn(`[教室导航] 未找到起点节点: ${startValue}`);
                }
            }
        }
        
        /**
         * 将教室信息同步到终点输入框，建立位置数据与教室属性的关联
         * @param {Object} result - 教室导航结果
         */
        function syncClassroomToDestination(result) {
            if (!result || !result.classroom) return;
            
            // 将教室编号设置到终点输入框
            const endInput = document.getElementById('end-input');
            endInput.value = result.classroom;
            
            // 更新教室信息到路径信息面板
            updateClassroomPathInfo(result);
        }
        
        /**
         * 更新路径信息面板中的教室信息
         * @param {Object} result - 教室导航结果
         */
        function updateClassroomPathInfo(result) {
            const pathInfo = document.getElementById('path-info');
            const pathDetails = document.getElementById('path-details');
            
            // 如果没有路径，显示教室信息
            if (!currentPath || currentPath.length === 0) {
                pathDetails.innerHTML = `
                    <strong>目标教室：</strong>${result.classroom}<br>
                    <strong>所在楼层：</strong>${result.floor}楼<br>
                    <strong>推荐楼梯：</strong>${result.recommended_stairs.map(s => STAIR_NAMES[s] || s).join('、')}
                `;
                pathInfo.classList.add('active');
            }
        }

        // 获取推荐楼梯口（前端备用逻辑）
        function getRecommendedStairs(floor, roomNumber) {
            const room = roomNumber;
            
            if (floor === 1) {
                if (room >= 1 && room <= 5) return ['F9', 'F10'];
                if (room >= 6 && room <= 9) return ['F3', 'F9'];
                if (room >= 10 && room <= 11) return ['F3', 'F4'];
                if (room >= 12 && room <= 18) return ['F4', 'F10'];
                if (room >= 19 && room <= 22) return ['F7', 'F8'];
                if (room >= 23 && room <= 31) return ['F1', 'F2'];
            } else if (floor === 2) {
                if (room >= 1 && room <= 14) return ['F9', 'F10'];
                if (room >= 15 && room <= 29) return ['F3', 'F4'];
                if (room >= 30 && room <= 31) return ['F4', 'F8'];
                if (room >= 32 && room <= 44) return ['F7', 'F8'];
                if (room >= 45 && room <= 50) return ['F1', 'F2'];
            } else if (floor === 3 || floor === 4) {
                if (room >= 1 && room <= 14) return ['F9', 'F10'];
                if (room >= 16 && room <= 19) return ['F9', 'F7'];
                if (room >= 20 && room <= 25) return ['F3', 'F7'];
                if (room >= 26 && room <= 40) return ['F3', 'F4'];
                if (room >= 41 && room <= 42) return ['F4', 'F8'];
                if (room >= 43 && room <= 56) return ['F7', 'F8'];
                if (room >= 57 && room <= 69) return ['F1', 'F2'];
            } else if (floor === 5) {
                if (room >= 1 && room <= 14) return ['F9', 'F10'];
                if (room >= 16 && room <= 19) return ['F9', 'F7'];
                if (room >= 20 && room <= 25) return ['F3', 'F7'];
                if (room >= 26 && room <= 40) return ['F3', 'F4'];
                if (room >= 41 && room <= 42) return ['F4', 'F8'];
                if (room >= 43 && room <= 56) return ['F7', 'F8'];
                if (room >= 57 && room <= 72) return ['F1', 'F2'];
            }
            
            return [];
        }

        // 显示错误信息
        function showErrorMessage(message, isSuccess = false) {
            const errorDiv = document.querySelector('.classroom-nav-section .error-message') || createErrorMessageElement();
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            if (isSuccess) {
                errorDiv.classList.add('success');
            } else {
                errorDiv.classList.remove('success');
            }
        }

        // 隐藏错误信息
        function hideErrorMessage() {
            const errorDiv = document.querySelector('.classroom-nav-section .error-message');
            if (errorDiv) {
                errorDiv.classList.remove('active', 'success');
            }
        }

        // 创建错误信息元素（如果不存在）
        function createErrorMessageElement() {
            const section = document.querySelector('.classroom-nav-section');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            section.appendChild(errorDiv);
            return errorDiv;
        }

        /**
         * 点击楼层平面图缩放处理
         * 点击图片区域时放大，点击标记不触发缩放
         */
        document.getElementById('floor-image-container').addEventListener('click', function(e) {
            // 阻止事件冒泡
            e.stopPropagation();
            
            // 点击非标记区域时放大
            const target = e.target;
            if (!target.classList.contains('classroom-marker') && 
                !target.closest('.classroom-marker')) {
                
                const currentZoom = floorPlanZoom;
                const zoomLevels = [0.25, 0.5, 1, 2];
                const currentIndex = zoomLevels.indexOf(currentZoom);
                
                // 找到下一个缩放级别
                let nextIndex = currentIndex + 1;
                if (nextIndex >= zoomLevels.length) {
                    nextIndex = 0; // 循环回最小缩放
                }
                
                setZoom(zoomLevels[nextIndex]);
                console.log(`[教室导航] 点击放大: ${currentZoom * 100}% -> ${zoomLevels[nextIndex] * 100}%`);
            }
        });

        /**
         * 从当前位置导航到楼梯口
         * @param {string} stairId - 楼梯口ID
         */
        async function navigateToStair(stairId) {
            // 检查是否有当前位置
            if (!currentStartId) {
                console.warn('[教室导航] 未设置起点，无法导航到楼梯口');
                alert('请先在地图上选择您的当前位置！');
                return;
            }
            
            // 查找楼梯口节点
            const allPoints = getAllPoints();
            const stairPoint = allPoints.find(p => p.id === stairId || p.name === stairId);
            
            if (!stairPoint) {
                console.error(`[教室导航] 未找到楼梯口: ${stairId}`);
                alert(`未找到楼梯口: ${stairId}`);
                return;
            }
            
            console.log(`[教室导航] 起点: ${currentStartId}, 终点: ${stairPoint.id}`);
            
            // 保存当前终点
            const originalEndId = currentEndId;
            
            // 设置终点为楼梯口
            currentEndId = stairPoint.id;
            
            // 执行路径计算
            await calculatePath();
            
            // 恢复原终点
            currentEndId = originalEndId;
            
            console.log(`[教室导航] 路径计算完成`);
        }

        /**
         * 在教室导航成功后，自动规划到推荐楼梯口的路径
         * 实现自动选择与起点路径最短的楼梯口
         * @param {Array} stairs - 推荐楼梯口列表
         */
        async function planRouteToStair(stairs) {
            if (!stairs || stairs.length === 0) {
                console.log('[教室导航] 未找到推荐楼梯口');
                return;
            }
            
            if (!currentStartId) {
                console.log('[教室导航] 未设置起点，无法计算最短路径');
                return;
            }
            
            // 计算从起点到每个推荐楼梯口的最短路径，选择路径最短的楼梯口
            const stairDistances = [];
            
            for (const stairId of stairs) {
                const distance = await calculateDistanceToStair(stairId);
                if (distance !== null && distance !== Infinity) {
                    stairDistances.push({ stairId, distance });
                }
            }
            
            if (stairDistances.length === 0) {
                console.warn('[教室导航] 无法计算到任何推荐楼梯口的路径');
                // 降级到第一个推荐楼梯口
                highlightStairOnMap(stairs[0]);
                return;
            }
            
            // 按距离排序，选择最短路径的楼梯口
            stairDistances.sort((a, b) => a.distance - b.distance);
            const preferredStair = stairDistances[0].stairId;
            const shortestDistance = stairDistances[0].distance;
            
            console.log(`[教室导航] 楼梯口距离分析:`, stairDistances.map(s => `${s.stairId}: ${s.distance.toFixed(1)}米`).join(', '));
            console.log(`[教室导航] 选择最短路径楼梯口: ${preferredStair}, 距离: ${shortestDistance.toFixed(1)}米`);
            
            // 在地图上高亮显示选中的楼梯口
            highlightStairOnMap(preferredStair);
            
            // 自动计算并显示路径
            await navigateToStair(preferredStair);
        }
        
        /**
         * 计算从起点到指定楼梯口的最短距离
         * @param {string} stairId - 楼梯口ID
         * @returns {Promise<number|null>} 最短距离，如果无法到达则返回null或Infinity
         */
        async function calculateDistanceToStair(stairId) {
            // 查找楼梯口节点
            const allPoints = getAllPoints();
            const stairPoint = allPoints.find(p => p.id === stairId || p.name === stairId);
            
            if (!stairPoint) {
                console.warn(`[教室导航] 未找到楼梯口节点: ${stairId}`);
                return Infinity;
            }
            
            // 使用Dijkstra算法计算从起点到楼梯口的最短路径
            const path = dijkstraCrossFloor(currentStartId, currentStartFloor, stairPoint.id);
            
            if (!path || path.length === 0) {
                return Infinity;
            }
            
            // 计算路径总距离
            let totalDistance = 0;
            for (let i = 0; i < path.length - 1; i++) {
                if (path[i].edge && path[i].edge.distance) {
                    totalDistance += path[i].edge.distance;
                }
            }
            
            return totalDistance;
        }
        
        /**
         * 在地图上高亮显示楼梯口
         * @param {string} stairId - 楼梯口ID
         */
        function highlightStairOnMap(stairId) {
            // 清除之前的路径高亮
            clearPath();
            
            // 查找楼梯口节点
            const allPoints = getAllPoints();
            const stairPoint = allPoints.find(p => p.id === stairId || p.name === stairId);
            
            if (!stairPoint) {
                console.warn(`[教室导航] 未找到楼梯口节点: ${stairId}`);
                return;
            }
            
            // 设置终点为楼梯口
            const endInput = document.getElementById('end-input');
            const stairDisplayName = STAIR_NAMES[stairId] || stairPoint.name;
            endInput.value = stairDisplayName;
            currentEndId = stairPoint.id;
            
            // 高亮显示楼梯口标记
            const markers = document.querySelectorAll('.point-marker');
            markers.forEach(marker => {
                // 移除其他标记的end类
                marker.classList.remove('end');
                
                // 为目标楼梯口添加end类
                if (marker.dataset.id === stairPoint.id) {
                    marker.classList.remove('normal', 'floor-1', 'floor-2', 'start');
                    marker.classList.add('end');
                }
            });
            
            console.log(`[教室导航] 高亮显示楼梯口: ${stairId}, 节点: ${stairPoint.name}, ID: ${stairPoint.id}`);
        }

        // 教室输入框验证反馈
        document.getElementById('classroom-input').addEventListener('input', function(e) {
            const input = e.target.value;
            const validation = validateClassroomInput(input);
            
            // 根据验证结果改变输入框样式
            if (input.trim()) {
                if (validation.valid) {
                    e.target.style.borderColor = '#10b981';
                    e.target.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.1)';
                } else {
                    e.target.style.borderColor = '#ef4444';
                    e.target.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
                }
            } else {
                e.target.style.borderColor = '#e8ecef';
                e.target.style.boxShadow = 'none';
            }
        });
        
        // ESC键关闭楼层平面图弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('floor-plan-modal');
                if (modal.classList.contains('active')) {
                    closeFloorPlanModal();
                }
            }
        });
        
        // ============ 测试与调试函数 ============
        
        // 预加载所有楼层平面图
        const preloadedImages = {};
        function preloadFloorPlanImages() {
            console.log('[教室导航] 开始预加载楼层平面图...');
            for (let floor = 1; floor <= 5; floor++) {
                const img = new Image();
                img.src = `data/C-5-${floor}floor.png`;
                img.onload = () => {
                    preloadedImages[floor] = img;
                    console.log(`[教室导航] ${floor}楼平面图预加载完成`);
                };
                img.onerror = () => {
                    console.error(`[教室导航] ${floor}楼平面图预加载失败`);
                };
            }
        }
        
        /**
         * 测试教室导航功能
         * 在控制台运行此函数进行测试
         */
        window.testClassroomNavigation = async function() {
            console.log('========== 教室导航功能测试 ==========');
            
            // 1. 检查数据加载
            console.log('1. 检查数据加载...');

            console.log(`   二楼节点数: ${pointsFloor2.length}`);
            console.log(`   一楼路径数: ${pathsFloor1.length}`);
            console.log(`   二楼路径数: ${pathsFloor2.length}`);
            console.log(`   跨层连接数: ${virtualConnections.length}`);
            
            // 2. 检查楼梯口节点
            console.log('\n2. 检查楼梯口节点...');

                console.log(`   ${stair}: ${found ? '✓ 找到' : '✗ 未找到'}`);

            console.log('\n3. 测试图片文件...');

            }
            
            // 4. 测试起点设置
            console.log('\n4. 测试起点设置...');
            const testStart = 'C-2图书馆';
            const startPoint = allPoints.find(p => p.name === testStart);
            if (startPoint) {
                currentStartId = startPoint.id;
                currentStartFloor = startPoint.floor;
                document.getElementById('start-input').value = testStart;
                console.log(`   起点设置: ✓ ${testStart} (ID: ${currentStartId}, 楼层: ${currentStartFloor})`);
            } else {
                console.log(`   起点设置: ✗ 未找到 ${testStart}`);
            }
            
            console.log('\n========== 测试完成 ==========');
        };
        
        /**
         * 快速测试路径规划
         */
        window.testPathPlanning = async function(startName, endName) {
            console.log(`测试路径规划: ${startName} -> ${endName}`);
            
            const allPoints = getAllPoints();
            const startPoint = allPoints.find(p => p.name === startName);
            const endPoint = allPoints.find(p => p.name === endName);
            
            if (!startPoint || !endPoint) {
                console.error('起点或终点不存在');
                return;
            }
            
            // 设置起点和终点
            currentStartId = startPoint.id;
            currentStartFloor = startPoint.floor;
            currentEndId = endPoint.id;
            
            document.getElementById('start-input').value = startName;
            document.getElementById('end-input').value = endName;
            
            // 执行路径计算
            await calculatePath();
        };
    </script>
