<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园导航系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <h1>校园导航系统</h1>
            <p>Campus Navigation System</p>
        </header>

        <!-- 主体内容 -->
        <main class="main-content">
            <!-- 地图区域 -->
            <div class="map-wrapper">
                <canvas id="mapCanvas" class="map-canvas"></canvas>
            </div>

            <!-- 控制面板 -->
            <div class="control-panel">
                <div class="select-group">
                    <label for="startSelect">起点</label>
                    <select id="startSelect" class="location-select">
                        <option value="">请选择起点</option>
                    </select>
                </div>

                <div class="select-group">
                    <label for="endSelect">终点</label>
                    <select id="endSelect" class="location-select">
                        <option value="">请选择终点</option>
                    </select>
                </div>

                <button id="navigateBtn" class="navigate-btn">开始导航</button>
            </div>

            <!-- 路径信息面板 -->
            <div id="pathPanel" class="path-panel hidden">
                <div class="path-header">
                    <h3>导航结果</h3>
                    <button id="closePanelBtn" class="close-btn">&times;</button>
                </div>
                <div class="path-content">
                    <div id="pathRoute" class="path-route"></div>
                    <div id="pathDistance" class="path-distance"></div>
                </div>
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>&copy; 2024 校园导航系统 | 最短路径算法：Dijkstra</p>
        </footer>
    </div>

    <!-- 提示弹窗 -->
    <div id="toast" class="toast hidden">
        <div class="toast-content"></div>
    </div>

    <script src="graph.js"></script>
    <script src="app.js"></script>
</body>
</html>
